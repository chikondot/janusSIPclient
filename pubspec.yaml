name: generic_voip_client
description: This is a test project to test janus implementation in flutter

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^1.2.1
  shared_preferences: ^2.1.0
  permission_handler: ^12.0.1
  crypto: ^3.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

# define launcher icon image
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/janus_icon.png"

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - images/
